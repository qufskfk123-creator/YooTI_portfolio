<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preload" href="image/hero-bg.webm" as="video" type="video/webm">
  <link rel="preload" href="image/profile.webp" as="image" type="image/webp">
</head>
<body>
  <nav class="navbar">
    <div class="container nav-container">
      <a href="#" class="logo">Portfolio</a>
      <ul class="nav-links">
        <li><a href="#hero">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#all-projects">Image</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <section id="hero" class="hero">
    <video class="hero-bg-video" muted autoplay loop playsinline></video>
    <div class="hero-overlay"></div>
    <div class="container hero-content">
      <h1><span class="highlight" data-content="hero.name">TAEIL YOO</span></h1>
      <p data-content="hero.subtitle">3D Graphics & VFX Artist</p>
      <a href="#projects" class="btn" data-content="hero.btnText" data-href="hero.btnHref">View My Work</a>
      <button onclick="downloadPDF()" class="btn btn-pdf">Download PDF</button>
    </div>
  </section>

  <section id="about" class="about">
    <div class="container">
      <h2 class="section-title" data-content="about.sectionTitle">About Me</h2>
      <div class="about-content">
        <div class="about-img">
          <picture>
            <source srcset="image/profile.webp" type="image/webp">
            <img src="image/profile.jpg" alt="Profile photo" loading="lazy">
          </picture>
        </div>
        <div class="about-text">
          <p data-content="about.desc1"></p>
          <p data-content="about.desc2"></p>
        </div>
      </div>
      <div class="about-career" id="about-career">
        <h3 class="career-title" data-content="career.sectionTitle">Experience</h3>
        <div class="career-list"></div>
      </div>
    </div>
  </section>

  <section id="skills" class="skills">
    <div class="container">
      <h2 class="section-title" data-content="skills.sectionTitle">Skills</h2>
      <div class="skills-grid" id="skills-grid">
      </div>
    </div>
  </section>

  <section id="projects" class="projects">
    <div class="container">
      <h2 class="section-title">Projects</h2>
      <div class="projects-grid" id="projects-grid">
      </div>
    </div>
  </section>

  <section id="all-projects" class="all-projects">
    <div class="container">
      <h2 class="section-title">Image</h2>
      <div class="all-projects-list" id="all-projects-list">
      </div>
    </div>
  </section>

  <section id="contact" class="contact">
    <div class="container">
      <h2 class="section-title" data-content="contact.sectionTitle">Contact</h2>
      <div class="contact-info" id="contact-info">
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p data-content="footer.copyright">&copy; 2026 TAEIL YOO. All rights reserved.</p>
    </div>
  </footer>

  <div id="lightbox" class="lightbox">
    <span class="lightbox-close">&times;</span>
    <button class="lightbox-nav lightbox-prev">&#10094;</button>
    <button class="lightbox-nav lightbox-next">&#10095;</button>
    <img class="lightbox-media lightbox-img" src="" alt="">
    <video class="lightbox-media lightbox-video" src="" controls autoplay muted playsinline></video>
    <div class="lightbox-title"></div>
    <div class="lightbox-counter"></div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>window.jsPDF = window.jspdf.jsPDF;</script>
<script src="contentData.js"></script>
<script src="imageData.js"></script>
<script>
  function downloadPDF() {
    document.body.classList.add('pdf-export');

    var allProj = document.querySelector('.all-projects');
    var allProjWasActive = allProj && allProj.classList.contains('active');
    if (allProj) allProj.classList.add('active');

    var subsState = [];
    document.querySelectorAll('.all-project-subs').forEach(function(s) {
      var items = [];
      s.querySelectorAll('.all-project-item').forEach(function(item) {
        items.push(item);
        item.style.opacity = '1';
        item.style.transform = 'none';
      });
      subsState.push({ el: s, wasOpen: s.classList.contains('open'), items: items });
      s.classList.add('open');
    });

    var videoReplaces = [];
    document.querySelectorAll('video').forEach(function(v) {
      var img = document.createElement('img');
      var poster = v.getAttribute('poster');
      if (poster) img.src = poster;
      img.style.cssText = v.style.cssText;
      img.className = v.className;
      img.style.width = '100%';
      img.style.height = '100%';
      img.style.objectFit = 'cover';
      v.parentNode.replaceChild(img, v);
      videoReplaces.push({ img: img, video: v });
    });

    var imgReplaces = [];
    document.querySelectorAll('.all-project-item img, .project-img img, .about-img img').forEach(function(img) {
      if (!img.src) return;
      var div = document.createElement('div');
      div.style.width = '100%';
      div.style.height = '100%';
      div.style.backgroundImage = "url('" + img.src + "')";
      div.style.backgroundSize = 'cover';
      div.style.backgroundPosition = 'center';
      div.style.backgroundRepeat = 'no-repeat';
      if (img.className) div.className = img.className;
      img.parentNode.replaceChild(div, img);
      imgReplaces.push({ div: div, img: img });
    });

    function restoreAll() {
      document.body.classList.remove('pdf-export');
      if (allProj && !allProjWasActive) allProj.classList.remove('active');
      subsState.forEach(function(s) {
        if (!s.wasOpen) s.el.classList.remove('open');
        s.items.forEach(function(item) {
          item.style.opacity = '';
          item.style.transform = '';
        });
      });
      videoReplaces.forEach(function(r) {
        r.img.parentNode.replaceChild(r.video, r.img);
      });
      imgReplaces.forEach(function(r) {
        r.div.parentNode.replaceChild(r.img, r.div);
      });
    }

    setTimeout(function() {
      html2canvas(document.body, {
        scale: 2,
        backgroundColor: '#fff',
        useCORS: true,
        logging: false
      }).then(function(canvas) {
        var imgData = canvas.toDataURL('image/jpeg', 0.95);
        var pdf = new jsPDF({
          orientation: 'portrait',
          unit: 'mm',
          format: [210, canvas.height / canvas.width * 210]
        });
        pdf.addImage(imgData, 'JPEG', 0, 0, 210, canvas.height / canvas.width * 210);
        pdf.save('TAEIL_YOO_Portfolio.pdf');
        restoreAll();
      }).catch(function(e) {
        console.error('PDF download failed:', e);
        restoreAll();
      });
    }, 100);
  }

  function renderContent() {
    if (typeof contentData === 'undefined') return;
    document.title = contentData.pageTitle || 'Portfolio';
    document.querySelectorAll('[data-content]').forEach(function(el) {
      var path = el.dataset.content.split('.');
      var val = contentData;
      for (var p = 0; p < path.length; p++) { if (val) val = val[path[p]]; }
      if (typeof val === 'string') el.innerHTML = val;
      if (el.dataset.href) {
        var hrefPath = el.dataset.href.split('.');
        var hrefVal = contentData;
        for (var p = 0; p < hrefPath.length; p++) { if (hrefVal) hrefVal = hrefVal[hrefPath[p]]; }
        if (typeof hrefVal === 'string') el.href = hrefVal;
      }
    });
    var navLinks = document.querySelector('.nav-links');
    if (navLinks && contentData.nav && contentData.nav.links) {
      navLinks.innerHTML = contentData.nav.links.map(function(l) {
        return '<li><a href="' + l.href + '">' + l.label + '</a></li>';
      }).join('');
    }
    var logo = document.querySelector('.logo');
    if (logo && contentData.nav) logo.textContent = contentData.nav.logo || 'Portfolio';
    var skillsGrid = document.getElementById('skills-grid');
    if (skillsGrid && contentData.skills && contentData.skills.items) {
      skillsGrid.innerHTML = contentData.skills.items.map(function(s) {
        return '<div class="skill-card">' + s + '</div>';
      }).join('');
    }
    var contactInfo = document.getElementById('contact-info');
    if (contactInfo && contentData.contact && contentData.contact.items) {
      contactInfo.innerHTML = contentData.contact.items.map(function(item) {
        if (item.url) {
          return '<a href="' + item.url + '" target="_blank" class="contact-item"><span class="contact-icon">' + item.icon + '</span><span>' + item.text + '</span></a>';
        }
        return '<div class="contact-item"><span class="contact-icon">' + item.icon + '</span><span>' + item.text + '</span></div>';
      }).join('');
    }
    var careerList = document.querySelector('.career-list');
    if (careerList && contentData.career && contentData.career.items) {
      careerList.innerHTML = contentData.career.items.map(function(item) {
        return '<div class="career-item"><span class="career-period">' + item.period + '</span><div class="career-info"><strong>' + item.title + '</strong><span class="career-subtitle">' + item.subtitle + '</span><p>' + item.desc + '</p></div></div>';
      }).join('');
    }
  }

  renderContent();

  var allSection = document.getElementById('all-projects');
  document.querySelector('.nav-links').addEventListener('click', function(e) {
    var link = e.target.closest('a');
    if (!link) return;
    allSection.classList.toggle('active', link.getAttribute('href') === '#all-projects');
  });

  var allObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (!entry.isIntersecting) allSection.classList.remove('active');
    });
  }, { threshold: 0 });
  allObserver.observe(allSection);

  (function() {
    var videoExts = ['mp4', 'webm', 'mov', 'avi', 'mkv'];
    function isVideoExt(ext) { return videoExts.indexOf(ext) !== -1; }

    var allItems = [];
    var lookup = {};

    function addEntry(entry, galleryOnly) {
      var key = entry[0], title = entry[1], desc = entry[2] || '', url = entry[3] || '', ext = entry[4] || 'jpg', isLarge = !!entry[5];
      var idx = allItems.length;
      allItems.push({ key: key, title: title, desc: desc, url: url, ext: ext, isLarge: isLarge, galleryOnly: galleryOnly });
      lookup[key] = idx;
    }

    if (typeof imageDataList !== 'undefined') {
      imageDataList.forEach(function(e) { addEntry(e, false); });
    }
    if (typeof imageGalleryExtra !== 'undefined') {
      imageGalleryExtra.forEach(function(e) {
        if (lookup[e[0]] !== undefined) {
          var idx = lookup[e[0]];
          allItems[idx].title = e[1] || allItems[idx].title;
          allItems[idx].desc = e[2] || allItems[idx].desc;
          allItems[idx].url = e[3] || allItems[idx].url;
        } else {
          addEntry(e, true);
        }
      });
    }

    function gridUrl(item) {
      return isVideoExt(item.ext)
        ? 'image/' + item.key + '.' + item.ext
        : 'image/' + item.key + '-thumb.' + item.ext;
    }

    function lightboxUrl(item) {
      if (isVideoExt(item.ext)) return 'image/' + item.key + '.' + item.ext;
      return item.isLarge
        ? 'image/' + item.key + '-lg.' + item.ext
        : 'image/' + item.key + '.' + item.ext;
    }

    function posterUrl(key) { return 'image/' + key + '-poster.webp'; }

    var lightbox = document.getElementById('lightbox');
    var lbImg = lightbox.querySelector('.lightbox-img');
    var lbVideo = lightbox.querySelector('.lightbox-video');
    var lbTitle = lightbox.querySelector('.lightbox-title');
    var lbCounter = lightbox.querySelector('.lightbox-counter');

    // Hero background
    var heroEntry = allItems[lookup['hero-bg']];
    if (heroEntry && isVideoExt(heroEntry.ext)) {
      var heroVideo = document.querySelector('.hero-bg-video');
      if (heroVideo) heroVideo.src = 'image/' + heroEntry.key + '.' + heroEntry.ext;
    }

    // Filter for display (exclude hero-bg, profile)
    var displayItems = allItems.filter(function(item) {
      return item.key !== 'hero-bg' && item.key !== 'profile';
    });

    // Build project grid
    var grid = document.getElementById('projects-grid');
    grid.innerHTML = '';
    var cardCount = 0;
    displayItems.forEach(function(item, i) {
      if (item.galleryOnly) return;
      cardCount++;
      var card = document.createElement('div');
      card.className = 'project-card';
      card.dataset.idx = i;
      card.dataset.key = 'proj' + cardCount;
      var gUrl = gridUrl(item);
      var isVid = isVideoExt(item.ext);
      var mediaHtml = isVid
        ? '<video src="' + gUrl + '" muted autoplay playsinline loop loading="lazy" poster="' + posterUrl(item.key) + '"></video>'
        : '<img src="' + gUrl + '" alt="' + item.title + '" loading="lazy">';
      var urlVal = item.url || '';
      card.innerHTML =
        '<div class="project-img">' + mediaHtml + '</div>' +
        '<h3>' + item.title + '</h3>' +
        '<p>' + item.desc + '</p>' +
        (urlVal ? '<div class="project-link-wrap"><a href="' + urlVal + '" class="project-link" target="_blank" rel="noopener noreferrer">&#128279; Link</a></div>' : '');
      grid.appendChild(card);
    });

    var currentIdx = 0;

    function updateLightbox(idx) {
      var item = displayItems[idx];
      if (!item) return;
      var lbUrl = lightboxUrl(item);
      var isVid = isVideoExt(item.ext);
      lbImg.style.display = isVid ? 'none' : 'block';
      lbVideo.style.display = isVid ? 'block' : 'none';
      if (isVid) { lbVideo.src = lbUrl; lbVideo.load(); lbVideo.play(); }
      else { lbImg.src = lbUrl; }
      lbCounter.textContent = (currentIdx + 1) + ' / ' + displayItems.length;
      lbTitle.textContent = item.title;
    }

    function openLightbox(idx) { currentIdx = idx; updateLightbox(idx); lightbox.classList.add('active'); }
    function closeLightbox() { lightbox.classList.remove('active'); lbVideo.pause(); lbVideo.src = ''; lbImg.src = ''; }
    function moveImage(step) {
      currentIdx = (currentIdx + step + displayItems.length) % displayItems.length;
      updateLightbox(currentIdx);
    }

    function createThumb(item, idx) {
      var gUrl = gridUrl(item);
      var isVid = isVideoExt(item.ext);
      var html = isVid
        ? '<video src="' + gUrl + '" muted autoplay playsinline loop loading="lazy" poster="' + posterUrl(item.key) + '"></video>'
        : '<img src="' + gUrl + '" alt="' + item.title + '" loading="lazy">';
      var div = document.createElement('div');
      div.className = 'all-project-item';
      div.dataset.idx = idx;
      div.innerHTML = html;
      div.addEventListener('click', function() { var i = parseInt(this.dataset.idx); if (!isNaN(i)) openLightbox(i); });
      return div;
    }

    // Build Image gallery
    var allList = document.getElementById('all-projects-list');
    if (allList) {
      allList.innerHTML = '';
      var groups = {};
      displayItems.forEach(function(item, i) {
        var parts = item.key.split('-');
        var baseKey = parts[0];
        if (!groups[baseKey]) groups[baseKey] = {main: null, subs: []};
        if (parts.length === 1) groups[baseKey].main = {item: item, idx: i};
        else groups[baseKey].subs.push({item: item, idx: i});
      });

      Object.keys(groups).forEach(function(baseKey) {
        var group = groups[baseKey];
        if (group.subs.length === 0) { allList.appendChild(createThumb(group.main.item, group.main.idx)); return; }

        var mUrl = gridUrl(group.main.item);
        var mVid = isVideoExt(group.main.item.ext);
        var mainDiv = document.createElement('div');
        mainDiv.className = 'all-project-item all-project-group-header';
        mainDiv.innerHTML = mVid
          ? '<video src="' + mUrl + '" muted autoplay playsinline loop loading="lazy" poster="' + posterUrl(group.main.item.key) + '"></video>'
          : '<img src="' + mUrl + '" alt="' + group.main.item.title + '" loading="lazy">';
        var badge = document.createElement('span');
        badge.className = 'all-project-badge';
        badge.textContent = '+' + group.subs.length;
        mainDiv.appendChild(badge);

        var subsWrap = document.createElement('div');
        subsWrap.className = 'all-project-subs';
        group.subs.forEach(function(sub) { subsWrap.appendChild(createThumb(sub.item, sub.idx)); });
        var expanded = false;
        mainDiv.addEventListener('click', function(e) {
          expanded = !expanded;
          subsWrap.classList.toggle('open', expanded);
          badge.textContent = expanded ? '-' + group.subs.length : '+' + group.subs.length;
        });
        allList.appendChild(mainDiv);
        allList.appendChild(subsWrap);
      });
    }

    // Card click -> lightbox
    document.querySelectorAll('.project-card').forEach(function(card) {
      card.addEventListener('click', function(e) {
        if (e.target.closest('.project-link-wrap')) return;
        var idx = parseInt(this.dataset.idx);
        if (!isNaN(idx)) openLightbox(idx);
      });
    });

    // About img click -> open first lightbox item
    var aboutImg = document.querySelector('.about-img img');
    if (aboutImg) aboutImg.addEventListener('click', function() { openLightbox(0); });

    lightbox.addEventListener('click', function(e) { if (e.target === lightbox) closeLightbox(); });
    lightbox.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
    lightbox.querySelector('.lightbox-prev').addEventListener('click', function() { moveImage(-1); });
    lightbox.querySelector('.lightbox-next').addEventListener('click', function() { moveImage(1); });
    document.addEventListener('keydown', function(e) {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') moveImage(-1);
      if (e.key === 'ArrowRight') moveImage(1);
    });
  })();
</script>
</body>
</html>
