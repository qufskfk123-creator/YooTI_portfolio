<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container nav-container">
      <a href="#" class="logo">Portfolio</a>
      <ul class="nav-links">
        <li><a href="#hero">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#all-projects">Image</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <section id="hero" class="hero">
    <video class="hero-bg-video" muted autoplay loop playsinline></video>
    <div class="hero-overlay"></div>
    <div class="container hero-content">
      <h1><span class="highlight" data-content="hero.name">TAEIL YOO</span></h1>
      <p data-content="hero.subtitle">3D Graphics & VFX Artist</p>
      <a href="#projects" class="btn" data-content="hero.btnText" data-href="hero.btnHref">View My Work</a>
    </div>
  </section>

  <section id="about" class="about">
    <div class="container">
      <h2 class="section-title" data-content="about.sectionTitle">About Me</h2>
      <div class="about-content">
        <div class="about-img">
          <img src="image/profile.jpg" alt="Profile photo">
        </div>
        <div class="about-text">
          <p data-content="about.desc1"></p>
          <p data-content="about.desc2"></p>
        </div>
      </div>
    </div>
  </section>

  <section id="skills" class="skills">
    <div class="container">
      <h2 class="section-title" data-content="skills.sectionTitle">Skills</h2>
      <div class="skills-grid" id="skills-grid">
      </div>
    </div>
  </section>

  <section id="projects" class="projects">
    <div class="container">
      <h2 class="section-title">Projects</h2>
      <div class="projects-grid" id="projects-grid">
      </div>
    </div>
  </section>

  <section id="all-projects" class="all-projects">
    <div class="container">
      <h2 class="section-title">Image</h2>
      <div class="all-projects-list" id="all-projects-list">
      </div>
    </div>
  </section>

  <section id="contact" class="contact">
    <div class="container">
      <h2 class="section-title" data-content="contact.sectionTitle">Contact</h2>
      <div class="contact-info" id="contact-info">
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p data-content="footer.copyright">&copy; 2026 TAEIL YOO. All rights reserved.</p>
    </div>
  </footer>

  <div id="lightbox" class="lightbox">
    <span class="lightbox-close">&times;</span>
    <button class="lightbox-nav lightbox-prev">&#10094;</button>
    <button class="lightbox-nav lightbox-next">&#10095;</button>
    <img class="lightbox-media lightbox-img" src="" alt="">
    <video class="lightbox-media lightbox-video" src="" controls autoplay muted playsinline></video>
    <div class="lightbox-title"></div>
    <div class="lightbox-counter"></div>
  </div>

<script src="contentData.js"></script>
<script src="imageData.js"></script>
<script>
  // --- Render content from contentData.js ---
  function renderContent() {
    if (typeof contentData === 'undefined') return;

    document.title = contentData.pageTitle || 'Portfolio';

    document.querySelectorAll('[data-content]').forEach(function(el) {
      var path = el.dataset.content.split('.');
      var val = contentData;
      for (var p = 0; p < path.length; p++) { if (val) val = val[path[p]]; }
      if (typeof val === 'string') el.innerHTML = val;

      if (el.dataset.href) {
        var hrefPath = el.dataset.href.split('.');
        var hrefVal = contentData;
        for (var p = 0; p < hrefPath.length; p++) { if (hrefVal) hrefVal = hrefVal[hrefPath[p]]; }
        if (typeof hrefVal === 'string') el.href = hrefVal;
      }
    });

    var navLinks = document.querySelector('.nav-links');
    if (navLinks && contentData.nav && contentData.nav.links) {
      navLinks.innerHTML = contentData.nav.links.map(function(l) {
        return '<li><a href="' + l.href + '">' + l.label + '</a></li>';
      }).join('');
    }

    var logo = document.querySelector('.logo');
    if (logo && contentData.nav) logo.textContent = contentData.nav.logo || 'Portfolio';

    var skillsGrid = document.getElementById('skills-grid');
    if (skillsGrid && contentData.skills && contentData.skills.items) {
      skillsGrid.innerHTML = contentData.skills.items.map(function(s) {
        return '<div class="skill-card">' + s + '</div>';
      }).join('');
    }

    var contactInfo = document.getElementById('contact-info');
    if (contactInfo && contentData.contact && contentData.contact.items) {
      contactInfo.innerHTML = contentData.contact.items.map(function(item) {
        return '<div class="contact-item"><span class="contact-icon">' + item.icon + '</span><span>' + item.text + '</span></div>';
      }).join('');
    }
  }

  // --- Init ---
  renderContent();

  // --- All Projects nav toggle (delegation for dynamic nav) ---
  var allSection = document.getElementById('all-projects');
  document.querySelector('.nav-links').addEventListener('click', function(e) {
    var link = e.target.closest('a');
    if (!link) return;
    if (link.getAttribute('href') === '#all-projects') {
      allSection.classList.add('active');
    } else {
      allSection.classList.remove('active');
    }
  });

  // --- Hide All Projects when scrolled out of view ---
  var allObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (!entry.isIntersecting) allSection.classList.remove('active');
    });
  }, { threshold: 0 });
  allObserver.observe(allSection);

  (function() {
    var found = [];
    var lightbox = document.getElementById('lightbox');
    var lightboxImg = lightbox.querySelector('.lightbox-img');
    var lightboxVideo = lightbox.querySelector('.lightbox-video');
    var lightboxTitle = lightbox.querySelector('.lightbox-title');
    var lightboxCounter = lightbox.querySelector('.lightbox-counter');

    function tryFile(n, ext, onFound, onFail) {
      fetch('image/' + n + '.' + ext, { method: 'HEAD' })
        .then(function(r) { if (r.ok) onFound(); else onFail(); })
        .catch(onFail);
    }

    function tryExtensions(n, onFound, onFail) {
      var exts = ['PNG', 'png', 'JPG', 'jpg', 'JPEG', 'jpeg', 'webp', 'gif', 'avif', 'svg', 'bmp', 'mp4', 'webm', 'mov', 'avi', 'mkv'];
      function next(i) {
        if (i >= exts.length) { onFail(); return; }
        tryFile(n, exts[i], function() { onFound('image/' + n + '.' + exts[i].toLowerCase()); }, function() { next(i + 1); });
      }
      next(0);
    }

    var videoExts = ['mp4', 'webm', 'mov', 'avi', 'mkv'];
    function isVideoUrl(url) {
      var ext = url.split('.').pop().toLowerCase();
      return videoExts.indexOf(ext) !== -1;
    }

    function build() {
      // Remove hero-bg / profile from found (lightbox 제외)
      var heroSrc = null;
      found = found.filter(function(item) {
        if (item.key === 'hero-bg') { if (item.src) heroSrc = item.src; return false; }
        if (item.key === 'profile') return false;
        return true;
      });
      if (heroSrc && isVideoUrl(heroSrc)) {
        var heroVideo = document.querySelector('.hero-bg-video');
        if (heroVideo) heroVideo.src = heroSrc;
      }

      var grid = document.getElementById('projects-grid');
      grid.innerHTML = '';
      var cardCount = 0;
      found.forEach(function(item, i) {
        if (item.galleryOnly) return;
        cardCount++;
        var card = document.createElement('div');
        card.className = 'project-card';
        card.dataset.key = 'proj' + cardCount;
        card.dataset.img = i;
        var thumb = isVideoUrl(item.src)
          ? '<video src="' + item.src + '" muted autoplay playsinline loop></video>'
          : '<img src="' + item.src + '" alt="' + item.title + '">';
        var urlVal = item.url || '';
        card.innerHTML =
          '<div class="project-img">' + thumb + '</div>' +
          '<h3>' + item.title + '</h3>' +
          '<p>' + (item.desc || '') + '</p>' +
          (urlVal ? '<div class="project-link-wrap"><a href="' + urlVal + '" class="project-link" target="_blank" rel="noopener noreferrer">&#128279; Link</a></div>' : '');
        grid.appendChild(card);
      });

      var currentIdx = 0;

      function getTitle(idx) {
        var card = document.querySelector('.project-card[data-img="' + idx + '"]');
        if (card) {
          var h3 = card.querySelector('h3');
          if (h3 && h3.textContent) return h3.textContent;
        }
        return found[idx] ? found[idx].title : '';
      }

      function updateLightbox(idx) {
        var src = found[idx].src;
        var isVid = isVideoUrl(src);
        lightboxImg.style.display = isVid ? 'none' : 'block';
        lightboxVideo.style.display = isVid ? 'block' : 'none';
        if (isVid) { lightboxVideo.src = src; lightboxVideo.load(); lightboxVideo.play(); }
        else { lightboxImg.src = src; }
        lightboxCounter.textContent = (currentIdx + 1) + ' / ' + found.length;
        lightboxTitle.textContent = getTitle(idx);
      }

      function openLightbox(idx) {
        currentIdx = idx;
        updateLightbox(idx);
        lightbox.classList.add('active');
      }

      function closeLightbox() {
        lightbox.classList.remove('active');
        lightboxVideo.pause();
      }

      function moveImage(step) {
        currentIdx = (currentIdx + step + found.length) % found.length;
        updateLightbox(currentIdx);
      }

      // --- Build Image gallery (grouped) ---
      function createThumb(item, idx) {
        var thumb = isVideoUrl(item.src)
          ? '<video src="' + item.src + '" muted autoplay playsinline loop></video>'
          : '<img src="' + item.src + '" alt="' + item.title + '">';
        var div = document.createElement('div');
        div.className = 'all-project-item';
        div.dataset.img = idx;
        div.innerHTML = thumb;
        div.addEventListener('click', function() {
          var i = parseInt(this.dataset.img);
          if (!isNaN(i)) openLightbox(i);
        });
        return div;
      }

      var allList = document.getElementById('all-projects-list');
      if (!allList) return;
      allList.innerHTML = '';

      var groups = {};
      found.forEach(function(item, i) {
        var parts = item.key.split('-');
        var baseKey = parts[0];
        if (!groups[baseKey]) groups[baseKey] = {main: null, subs: []};
        if (parts.length === 1) {
          groups[baseKey].main = {item: item, idx: i};
        } else {
          groups[baseKey].subs.push({item: item, idx: i});
        }
      });

      Object.keys(groups).forEach(function(baseKey) {
        var group = groups[baseKey];
        if (group.subs.length === 0) {
          var div = createThumb(group.main.item, group.main.idx);
          allList.appendChild(div);
          return;
        }

        var mainThumb = isVideoUrl(group.main.item.src)
          ? '<video src="' + group.main.item.src + '" muted autoplay playsinline loop></video>'
          : '<img src="' + group.main.item.src + '" alt="' + group.main.item.title + '">';
        var mainDiv = document.createElement('div');
        mainDiv.className = 'all-project-item all-project-group-header';
        mainDiv.innerHTML = mainThumb;

        var badge = document.createElement('span');
        badge.className = 'all-project-badge';
        badge.textContent = '+' + group.subs.length;
        mainDiv.appendChild(badge);

        var subsWrap = document.createElement('div');
        subsWrap.className = 'all-project-subs';
        group.subs.forEach(function(sub) {
          subsWrap.appendChild(createThumb(sub.item, sub.idx));
        });

        var expanded = false;
        mainDiv.addEventListener('click', function(e) {
          expanded = !expanded;
          subsWrap.classList.toggle('open', expanded);
          badge.textContent = expanded ? '-' + group.subs.length : '+' + group.subs.length;
        });

        allList.appendChild(mainDiv);
        allList.appendChild(subsWrap);
      });

      document.querySelectorAll('.project-card').forEach(function(card) {
        card.addEventListener('click', function(e) {
          if (e.target.closest('.project-link-wrap')) return;
          var idx = parseInt(this.dataset.img);
          if (!isNaN(idx)) openLightbox(idx);
        });
      });

      var aboutImg = document.querySelector('.about-img img');
      if (aboutImg) {
        aboutImg.addEventListener('click', function() {
          var clickedFile = this.getAttribute('src').split('/').pop().toLowerCase();
          for (var i = 0; i < found.length; i++) {
            if (found[i].src.split('/').pop().toLowerCase() === clickedFile) { openLightbox(i); return; }
          }
          openLightbox(0);
        });
      }

      lightbox.addEventListener('click', function(e) {
        if (e.target === lightbox) closeLightbox();
      });

      lightbox.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
      lightbox.querySelector('.lightbox-prev').addEventListener('click', function() { moveImage(-1); });
      lightbox.querySelector('.lightbox-next').addEventListener('click', function() { moveImage(1); });

      document.addEventListener('keydown', function(e) {
        if (!lightbox.classList.contains('active')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') moveImage(-1);
        if (e.key === 'ArrowRight') moveImage(1);
      });
    }

    // --- Phase 1: probe main entries (imageDataList) ---
    var mainEntries = [];
    if (typeof imageDataList !== 'undefined') {
      imageDataList.forEach(function(e) {
        mainEntries.push({key: e[0], title: e[1], desc: e[2] || '', url: e[3] || '', galleryOnly: false});
      });
    }
    if (!mainEntries.length) return;
    found = new Array(mainEntries.length);
    var loaded = 0;
    mainEntries.forEach(function(entry, i) {
      tryExtensions(entry.key, function(src) {
        found[i] = {src: src, title: entry.title, desc: entry.desc, url: entry.url, key: entry.key, galleryOnly: entry.galleryOnly};
        if (++loaded === mainEntries.length) probeAutoExtras();
      }, function() {
        if (++loaded === mainEntries.length) probeAutoExtras();
      });
    });

    // --- Phase 2: auto-discover key-1, key-2, key-3... ---
    function probeAutoExtras() {
      var baseKeys = [];
      mainEntries.forEach(function(e) {
        if (e.key !== 'hero-bg' && e.key !== 'profile') baseKeys.push(e.key);
      });

      var ki = 0;
      function nextKey() {
        if (ki >= baseKeys.length) {
          probeManualExtras();
          return;
        }
        var base = baseKeys[ki];
        var suf = 1;
        function trySuf() {
          var ek = base + '-' + suf;
          tryExtensions(ek, function(src) {
            found.push({src: src, title: base + ' #' + suf, desc: '', url: '', key: ek, galleryOnly: true});
            suf++;
            trySuf();
          }, function() {
            ki++;
            nextKey();
          });
        }
        trySuf();
      }
      nextKey();
    }

    // --- Phase 3: probe manually listed extras (imageGalleryExtra) ---
    function probeManualExtras() {
      if (typeof imageGalleryExtra === 'undefined' || !imageGalleryExtra.length) {
        build();
        return;
      }
      var keyMap = {};
      found.forEach(function(item, i) { keyMap[item.key] = i; });
      var pending = 0;
      imageGalleryExtra.forEach(function(e) {
        var idx = keyMap[e[0]];
        if (idx !== undefined) {
          found[idx].title = e[1] || found[idx].title;
          found[idx].desc = e[2] || found[idx].desc;
          found[idx].url = e[3] || found[idx].url;
          return;
        }
        pending++;
        tryExtensions(e[0], function(src) {
          found.push({src: src, title: e[1], desc: e[2] || '', url: e[3] || '', key: e[0], galleryOnly: true});
          if (--pending === 0) build();
        }, function() {
          if (--pending === 0) build();
        });
      });
      if (pending === 0) build();
    }
  })();

</script>
</body>
</html>
