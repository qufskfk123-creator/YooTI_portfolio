<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preload" href="image/hero-bg.webm" as="video" type="video/webm">
  <link rel="preload" href="image/profile.webp" as="image" type="image/webp">

</head>
<body>
  <nav class="navbar">
    <div class="container nav-container">
      <a href="#" class="logo">Portfolio</a>
      <ul class="nav-links">
        <li><a href="#hero">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#all-projects">Image</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <section id="hero" class="hero">
    <video class="hero-bg-video" muted autoplay loop playsinline></video>
    <div class="hero-overlay"></div>
    <div class="container hero-content">
      <h1><span class="highlight" data-content="hero.name">TAEIL YOO</span></h1>
      <p data-content="hero.subtitle">3D Graphics & VFX Artist</p>
      <a href="#projects" class="btn" data-content="hero.btnText" data-href="hero.btnHref">View My Work</a><br>
      <a href="#" onclick="downloadPDF(); return false;" class="btn btn-pdf">Download PDF</a>
    </div>
  </section>

  <section id="about" class="about">
    <div class="container">
      <h2 class="section-title" data-content="about.sectionTitle">About Me</h2>
      <div class="about-content">
        <div class="about-img">
          <img src="image/profile.jpg" alt="Profile photo" loading="lazy">
        </div>
        <div class="about-text">
          <p data-content="about.desc1"></p>
          <p data-content="about.desc2"></p>
        </div>
      </div>
      <div class="about-career" id="about-career">
        <h3 class="career-title" data-content="career.sectionTitle">Experience</h3>
        <div class="career-list"></div>
      </div>

    </div>
  </section>

  <section id="skills" class="skills">
    <div class="container">
      <h2 class="section-title" data-content="skills.sectionTitle">Skills</h2>
      <div class="skills-grid" id="skills-grid">
      </div>
      <div class="about-certification" id="about-certification">
        <h3 class="career-title" data-content="certification.sectionTitle">Certification</h3>
        <div class="certification-list"></div>
      </div>
      <div class="education" id="education">
        <h3 class="education-title" data-content="education.sectionTitle">Education Progress</h3>
        <div class="education-list" id="education-list"></div>
      </div>
    </div>
  </section>

  <section id="projects" class="projects">
    <div class="container">
      <h2 class="section-title">Projects</h2>
      <div class="projects-grid" id="projects-grid">
      </div>
    </div>
  </section>

  <section id="all-projects" class="all-projects">
    <div class="container">
      <h2 class="section-title">Image</h2>
      <div class="all-projects-list" id="all-projects-list">
      </div>
    </div>
  </section>

  <section id="contact" class="contact">
    <div class="container">
      <h2 class="section-title" data-content="contact.sectionTitle">Contact</h2>
      <div class="contact-info" id="contact-info">
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p data-content="footer.copyright">&copy; 2026 TAEIL YOO. All rights reserved.</p>
    </div>
  </footer>

  <div id="lightbox" class="lightbox">
    <span class="lightbox-close">&times;</span>
    <button class="lightbox-nav lightbox-prev">&#10094;</button>
    <button class="lightbox-nav lightbox-next">&#10095;</button>
    <img class="lightbox-media lightbox-img" src="" alt="">
    <video class="lightbox-media lightbox-video" src="" controls autoplay muted playsinline></video>
    <div class="lightbox-title"></div>
    <div class="lightbox-counter"></div>
  </div>

<script src="contentData.js"></script>
<script src="imageData.js"></script>
<script>
  function renderContent() {
    if (typeof contentData === 'undefined') return;
    document.title = contentData.pageTitle || 'Portfolio';
    document.querySelectorAll('[data-content]').forEach(function(el) {
      var path = el.dataset.content.split('.');
      var val = contentData;
      for (var p = 0; p < path.length; p++) { if (val) val = val[path[p]]; }
      if (typeof val === 'string') el.innerHTML = val;
      if (el.dataset.href) {
        var hrefPath = el.dataset.href.split('.');
        var hrefVal = contentData;
        for (var p = 0; p < hrefPath.length; p++) { if (hrefVal) hrefVal = hrefVal[hrefPath[p]]; }
        if (typeof hrefVal === 'string') el.href = hrefVal;
      }
    });
    var navLinks = document.querySelector('.nav-links');
    if (navLinks && contentData.nav && contentData.nav.links) {
      navLinks.innerHTML = contentData.nav.links.map(function(l) {
        return '<li><a href="' + l.href + '">' + l.label + '</a></li>';
      }).join('');
    }
    var logo = document.querySelector('.logo');
    if (logo && contentData.nav) logo.textContent = contentData.nav.logo || 'Portfolio';
    var skillsGrid = document.getElementById('skills-grid');
    if (skillsGrid && contentData.skills && contentData.skills.categories) {
      skillsGrid.innerHTML = contentData.skills.categories.map(function(cat) {
        var itemsHtml = (cat.items && cat.items.length)
          ? cat.items.map(function(s) { return '<span class="skill-tag">' + s + '</span>'; }).join('')
          : '<span class="skill-tag">' + cat.name + '</span>';
        return '<div class="skill-category"><span class="skill-category-title">' + cat.name + '</span><div class="skill-category-items">' + itemsHtml + '</div></div>';
      }).join('');
      // Scroll reveal animation
      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.style.opacity = '1';
            entry.target.style.transform = 'translateY(0)';
          }
        });
      }, { threshold: 0.1 });
      skillsGrid.querySelectorAll('.skill-category').forEach(function(card, i) {
        card.style.opacity = '0';
        card.style.transform = 'translateY(30px)';
        card.style.transition = 'opacity 0.5s ease ' + (i * 0.1) + 's, transform 0.5s ease ' + (i * 0.1) + 's';
        observer.observe(card);
      });
    }
    var educationList = document.getElementById('education-list');
    if (educationList && contentData.education && contentData.education.items) {
      educationList.innerHTML = contentData.education.items.map(function(item) {
        return '<span class="edu-tag">' + item + '</span>';
      }).join('');
    }
    var contactInfo = document.getElementById('contact-info');
    if (contactInfo && contentData.contact && contentData.contact.items) {
      contactInfo.innerHTML = contentData.contact.items.map(function(item) {
        if (item.url) {
          return '<a href="' + item.url + '" target="_blank" class="contact-item"><span class="contact-icon">' + item.icon + '</span><span>' + item.text + '</span></a>';
        }
        return '<div class="contact-item"><span class="contact-icon">' + item.icon + '</span><span>' + item.text + '</span></div>';
      }).join('');
    }
    function renderTimeline(container, items) {
      if (!container || !items) return;
      container.innerHTML = items.map(function(item) {
        var subtitleHtml = item.subtitle ? '<div class="timeline-subtitle">' + item.subtitle + '</div>' : '';
        var descHtml = item.desc ? '<p class="timeline-desc">' + item.desc + '</p>' : '';
        return '<div class="timeline-item"><div class="timeline-date">' + item.period + '</div><div class="timeline-title">' + item.title + '</div>' + subtitleHtml + descHtml + '</div>';
      }).join('');
    }
    var careerList = document.querySelector('.career-list');
    if (careerList) careerList.className = 'timeline';
    renderTimeline(careerList, contentData.career && contentData.career.items);
    var certList = document.querySelector('.certification-list');
    if (certList && contentData.certification && contentData.certification.items) {
      certList.innerHTML = contentData.certification.items.map(function(item) {
        return '<span class="cert-tag">' + item + '</span>';
      }).join('');
    }

  }

  renderContent();



  (function() {
    var videoExts = ['mp4', 'webm', 'mov', 'avi', 'mkv'];
    function isVideoExt(ext) { return videoExts.indexOf(ext) !== -1; }

    var allItems = [];
    var lookup = {};

    function addEntry(entry, galleryOnly) {
      var key = entry[0], title = entry[1], desc = entry[2] || '', url = entry[3] || '', ext = entry[4] || 'jpg', isLarge = !!entry[5];
      var idx = allItems.length;
      allItems.push({ key: key, title: title, desc: desc, url: url, ext: ext, isLarge: isLarge, galleryOnly: galleryOnly });
      lookup[key] = idx;
    }

    if (typeof imageDataList !== 'undefined') {
      imageDataList.forEach(function(e) { addEntry(e, false); });
    }
    if (typeof imageGalleryExtra !== 'undefined') {
      imageGalleryExtra.forEach(function(e) {
        if (lookup[e[0]] !== undefined) {
          var idx = lookup[e[0]];
          allItems[idx].title = e[1] || allItems[idx].title;
          allItems[idx].desc = e[2] || allItems[idx].desc;
          allItems[idx].url = e[3] || allItems[idx].url;
        } else {
          addEntry(e, true);
        }
      });
    }

    function subfolderUrl(key, ext) {
      var dash = key.indexOf('-');
      if (dash === -1) return null;
      return 'image/' + key.slice(0, dash) + '/' + key.slice(dash + 1) + '.' + ext;
    }

    function gridUrl(item) {
      var sf = subfolderUrl(item.key, item.ext);
      if (sf) return sf;
      return 'image/' + item.key + '.' + item.ext;
    }

    function lightboxUrl(item) {
      var sf = subfolderUrl(item.key, item.ext);
      if (sf) return sf;
      if (isVideoExt(item.ext)) return 'image/' + item.key + '.' + item.ext;
      return item.isLarge
        ? 'image/' + item.key + '-lg.' + item.ext
        : 'image/' + item.key + '.' + item.ext;
    }

    function posterUrl(key) { return 'image/' + key + '-poster.webp'; }

    var lightbox = document.getElementById('lightbox');
    var lbImg = lightbox.querySelector('.lightbox-img');
    var lbVideo = lightbox.querySelector('.lightbox-video');
    var lbTitle = lightbox.querySelector('.lightbox-title');
    var lbCounter = lightbox.querySelector('.lightbox-counter');

    // Hero background
    var heroEntry = allItems[lookup['hero-bg']];
    if (heroEntry && isVideoExt(heroEntry.ext)) {
      var heroVideo = document.querySelector('.hero-bg-video');
      if (heroVideo) heroVideo.src = 'image/' + heroEntry.key + '.' + heroEntry.ext;
    }

    // Filter for display (exclude hero-bg, profile)
    var displayItems = allItems.filter(function(item) {
      return item.key !== 'hero-bg' && item.key !== 'profile';
    });

    // Build project grid
    var grid = document.getElementById('projects-grid');
    grid.innerHTML = '';
    var cardCount = 0;
    displayItems.forEach(function(item, i) {
      if (item.galleryOnly) return;
      cardCount++;
      var card = document.createElement('div');
      card.className = 'project-card';
      card.dataset.idx = i;
      card.dataset.key = 'proj' + cardCount;
      var gUrl = gridUrl(item);
      var isVid = isVideoExt(item.ext);
      var mediaHtml = isVid
        ? '<video src="' + gUrl + '" muted autoplay playsinline loop loading="lazy" poster="' + posterUrl(item.key) + '"></video><div class="print-fallback-video"><span>&#9654;</span></div>'
        : '<img src="' + gUrl + '" alt="' + item.title + '" loading="lazy">';
      var urlVal = item.url || '';
      card.innerHTML =
        '<div class="project-img">' + mediaHtml + '</div>' +
        '<h3>' + item.title + '</h3>' +
        '<p>' + item.desc + '</p>' +
        (urlVal ? '<div class="project-link-wrap"><a href="' + urlVal + '" class="project-link" target="_blank" rel="noopener noreferrer">&#128279; Link</a></div>' : '');
      grid.appendChild(card);
    });

    var currentIdx = 0;
    var groupItems = [];

    function getBaseKey(key) {
      return key.indexOf('-') !== -1 ? key.split('-')[0] : key;
    }

    function updateLightbox(idx) {
      var item = groupItems[idx];
      if (!item) return;
      var lbUrl = lightboxUrl(item);
      var isVid = isVideoExt(item.ext);
      lbImg.style.display = isVid ? 'none' : 'block';
      lbVideo.style.display = isVid ? 'block' : 'none';
      if (isVid) { lbVideo.src = lbUrl; lbVideo.load(); lbVideo.play(); }
      else { lbImg.src = lbUrl; }
      lbCounter.textContent = (currentIdx + 1) + ' / ' + groupItems.length;
      lbTitle.textContent = item.title;
    }

    function openLightbox(idx) {
      var item = displayItems[idx];
      if (!item) return;
      var baseKey = getBaseKey(item.key);
      groupItems = [];
      displayItems.forEach(function(di) {
        if (getBaseKey(di.key) === baseKey) groupItems.push(di);
      });
      if (groupItems.length === 0) groupItems = [item];
      currentIdx = -1;
      for (var g = 0; g < groupItems.length; g++) {
        if (groupItems[g].key === item.key) { currentIdx = g; break; }
      }
      if (currentIdx === -1) currentIdx = 0;
      updateLightbox(currentIdx);
      lightbox.classList.add('active');
    }
    function closeLightbox() { lightbox.classList.remove('active'); lbVideo.pause(); lbVideo.src = ''; lbImg.src = ''; groupItems = []; }
    function moveImage(step) {
      if (groupItems.length === 0) return;
      currentIdx = (currentIdx + step + groupItems.length) % groupItems.length;
      updateLightbox(currentIdx);
    }

    function createThumb(item, idx) {
      var gUrl = gridUrl(item);
      var isVid = isVideoExt(item.ext);
      var html = isVid
        ? '<video src="' + gUrl + '" muted autoplay playsinline loop loading="lazy" poster="' + posterUrl(item.key) + '"></video><div class="print-fallback-video"><span>&#9654;</span></div>'
        : '<img src="' + gUrl + '" alt="' + item.title + '" loading="lazy">';
      var div = document.createElement('div');
      div.className = 'all-project-item';
      div.dataset.idx = idx;
      div.innerHTML = html;
      div.addEventListener('click', function() { var i = parseInt(this.dataset.idx); if (!isNaN(i)) openLightbox(i); });
      return div;
    }

    // Build Image gallery
    var allList = document.getElementById('all-projects-list');
    if (allList) {
      allList.innerHTML = '';
      var subItems = [];
      displayItems.forEach(function(item, i) {
        if (item.key.indexOf('-') !== -1) subItems.push({ item: item, idx: i });
      });
      var groups = {};
      subItems.forEach(function(entry) {
        var baseKey = entry.item.key.split('-')[0];
        if (!groups[baseKey]) groups[baseKey] = [];
        groups[baseKey].push(entry);
      });

      Object.keys(groups).forEach(function(baseKey) {
        var entries = groups[baseKey];
        var total = entries.length;
        var rest = entries.slice(1);

        var sizeClass = 'size-lg';

        var mainDiv = document.createElement('div');
        mainDiv.className = 'all-project-item all-project-group-header ' + sizeClass;
        var firstUrl = gridUrl(entries[0].item);
        var groupTitle = baseKey.replace(/^\d+\.\s*/, '');
        mainDiv.innerHTML = '<img src="' + firstUrl + '" alt="' + groupTitle + '" loading="lazy"><div class="all-project-group-label">' + groupTitle + '</div>';
        if (rest.length > 0) {
          var badge = document.createElement('span');
          badge.className = 'all-project-badge';
          badge.textContent = '+' + rest.length;
          mainDiv.appendChild(badge);

          var subsWrap = document.createElement('div');
          subsWrap.className = 'all-project-subs' + (rest.length > 20 ? ' all-project-subs-many' : '');
          rest.forEach(function(entry) { subsWrap.appendChild(createThumb(entry.item, entry.idx)); });
          var expanded = false;
          mainDiv.addEventListener('click', function(e) {
            if (e.target.tagName === 'IMG') {
              openLightbox(entries[0].idx);
              return;
            }
            expanded = !expanded;
            subsWrap.classList.toggle('open', expanded);
            badge.textContent = expanded ? '-' + rest.length : '+' + rest.length;
          });
        }
        allList.appendChild(mainDiv);
        if (subsWrap) allList.appendChild(subsWrap);
      });
    }

    // Card click -> lightbox
    document.querySelectorAll('.project-card').forEach(function(card) {
      card.addEventListener('click', function(e) {
        if (e.target.closest('.project-link-wrap')) return;
        var idx = parseInt(this.dataset.idx);
        if (!isNaN(idx)) openLightbox(idx);
      });
    });

    // About img click -> open first lightbox item
    var aboutImg = document.querySelector('.about-img img');
    if (aboutImg) aboutImg.addEventListener('click', function() { openLightbox(0); });

    lightbox.addEventListener('click', function(e) { if (e.target === lightbox) closeLightbox(); });
    lightbox.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
    lightbox.querySelector('.lightbox-prev').addEventListener('click', function() { moveImage(-1); });
    lightbox.querySelector('.lightbox-next').addEventListener('click', function() { moveImage(1); });
    document.addEventListener('keydown', function(e) {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') moveImage(-1);
      if (e.key === 'ArrowRight') moveImage(1);
    });
  })();

  function downloadPDF() {
    var urls = [];
    var allImgs = document.querySelectorAll('img');
    allImgs.forEach(function(img) {
      var s = img.src;
      if (s && urls.indexOf(s) === -1) urls.push(s);
      img.setAttribute('loading', 'eager');
      if (!img.complete && s) {
        img.src = '';
        img.src = s;
      }
    });
    document.querySelectorAll('video').forEach(function(v) {
      var p = v.getAttribute('poster');
      if (p && urls.indexOf(p) === -1) urls.push(p);
    });
    if (urls.length === 0) { window.print(); return; }
    var n = 0, t = urls.length, d = function() { n++; if (n >= t) window.print(); };
    urls.forEach(function(u) { var i = new Image(); i.onload = d; i.onerror = d; i.src = u; });
    setTimeout(function() { window.print(); }, 4000);
  }
</script>
</body>
</html>
