<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preload" href="image/hero-bg.mp4" as="video" type="video/mp4">
  <link rel="preload" href="image/hero-bg.webm" as="video" type="video/webm">
  <link rel="preload" href="image/profile.webp" as="image" type="image/webp">

</head>
<body>
  <nav class="navbar">
    <div class="container nav-container">
      <a href="#" class="logo">Portfolio</a>
      <button class="nav-toggle" aria-label="메뉴 열기" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="#hero">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#all-projects">Image</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <section id="hero" class="hero">
    <video class="hero-bg-video" muted autoplay loop playsinline></video>
    <div class="container hero-content">
      <div class="hero-text">
        <p class="hero-label" data-content="hero.subtitle"></p>
        <h1 data-content="hero.name"></h1>
        <p class="hero-desc" data-content="hero.desc"></p>
        <div class="hero-btns">
          <a href="#projects" class="btn" data-content="hero.btnText" data-href="hero.btnHref">View My Work</a>
          <a href="#" onclick="downloadPDF(); return false;" class="btn btn-pdf">Download PDF</a>
        </div>
      </div>
      <div class="hero-visual">
        <canvas id="hero-canvas"></canvas>
        <video id="hero-profile-video" src="image/profile-1.mp4" muted autoplay loop playsinline></video>
      </div>
    </div>
  </section>

  <section id="about" class="about">
    <div class="container">
      <h2 class="section-title reveal" data-content="about.sectionTitle">About Me</h2>
      <div class="about-img reveal" style="--i:2">
        <img src="image/profile.jpg" alt="Profile photo" loading="lazy">
      </div>
      <p class="about-name reveal" style="--i:1" data-content="about.name"></p>
      <div class="about-content">
        <div class="about-text">
          <p class="reveal" style="--i:0" data-content="about.desc1"></p>
          <p class="reveal" style="--i:1" data-content="about.desc2"></p>
          <p class="reveal" style="--i:2" data-content="about.desc3"></p>
        </div>
      </div>
      <div class="about-career" id="about-career">
        <div class="career-layout">
          <div class="career-col">
            <h3 class="career-col-title" data-content="career.sectionTitle">Experience</h3>
            <span class="career-years"></span>
            <div class="career-list"></div>
          </div>
          <div class="career-divider"></div>
          <div class="career-col">
            <h3 class="career-col-title">Skills</h3>
            <div class="career-skills" id="career-skills"></div>
          </div>
        </div>
      </div>

    </div>
  </section>


  <section id="projects" class="projects">
    <div class="container">
      <h2 class="section-title reveal">Projects</h2>
      <div class="projects-grid" id="projects-grid">
      </div>
    </div>
  </section>

  <section id="all-projects" class="all-projects">
    <div class="container">
      <h2 class="section-title reveal">Image</h2>
      <div class="all-projects-list" id="all-projects-list">
      </div>
    </div>
  </section>

  <section id="contact" class="contact">
    <div class="container">
      <div class="contact-left reveal">
        <h2 class="section-title" data-content="contact.sectionTitle">Contact</h2>
        <p class="contact-tagline" data-content="contact.tagline">함께할 기회를 기대합니다.</p>
        <p class="contact-tagline-sub" data-content="contact.taglineSub">I look forward to hearing from you.</p>
      </div>
      <div class="contact-right reveal" style="--i:1">
        <div class="contact-info" id="contact-info"></div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p data-content="footer.copyright">&copy; 2026 TAEIL YOO. All rights reserved.</p>
    </div>
  </footer>

  <div id="lightbox" class="lightbox">
    <span class="lightbox-close">&times;</span>
    <button class="lightbox-nav lightbox-prev">&#10094;</button>
    <button class="lightbox-nav lightbox-next">&#10095;</button>
    <img class="lightbox-media lightbox-img" src="" alt="">
    <video class="lightbox-media lightbox-video" src="" controls autoplay muted playsinline></video>
    <div class="lightbox-title"></div>
    <div class="lightbox-counter"></div>
  </div>

<script src="contentData.js"></script>
<script src="imageData.js"></script>
<script>
  function renderContent() {
    if (typeof contentData === 'undefined') return;
    document.title = contentData.pageTitle || 'Portfolio';
    document.querySelectorAll('[data-content]').forEach(function(el) {
      var path = el.dataset.content.split('.');
      var val = contentData;
      for (var p = 0; p < path.length; p++) { if (val) val = val[path[p]]; }
      if (typeof val === 'string') el.innerHTML = val;
      if (el.dataset.href) {
        var hrefPath = el.dataset.href.split('.');
        var hrefVal = contentData;
        for (var p = 0; p < hrefPath.length; p++) { if (hrefVal) hrefVal = hrefVal[hrefPath[p]]; }
        if (typeof hrefVal === 'string') el.href = hrefVal;
      }
    });
    var navLinks = document.querySelector('.nav-links');
    if (navLinks && contentData.nav && contentData.nav.links) {
      navLinks.innerHTML = contentData.nav.links.map(function(l) {
        return '<li><a href="' + l.href + '">' + l.label + '</a></li>';
      }).join('');
    }
    var logo = document.querySelector('.logo');
    if (logo && contentData.nav) logo.textContent = contentData.nav.logo || 'Portfolio';
    function renderSkillCategories(el) {
      if (!el || !contentData.skills || !contentData.skills.categories) return;
      el.innerHTML = contentData.skills.categories.map(function(cat, i) {
        var itemsHtml = (cat.items && cat.items.length)
          ? cat.items.map(function(s) { return '<span class="skill-tag">' + s + '</span>'; }).join('')
          : '<span class="skill-tag">' + cat.name + '</span>';
        return '<div class="skill-category reveal" style="--i:' + i + '"><span class="skill-category-title">' + cat.name + '</span><div class="skill-category-items">' + itemsHtml + '</div></div>';
      }).join('');
    }
    renderSkillCategories(document.getElementById('career-skills'));
    var educationList = document.getElementById('education-list');
    if (educationList && contentData.education && contentData.education.items) {
      educationList.innerHTML = contentData.education.items.map(function(item) {
        return '<span class="edu-tag">' + item + '</span>';
      }).join('');
    }
    var contactInfo = document.getElementById('contact-info');
    if (contactInfo && contentData.contact && contentData.contact.items) {
      contactInfo.innerHTML = contentData.contact.items.map(function(item) {
        if (item.url) {
          return '<a href="' + item.url + '" target="_blank" class="contact-item"><span class="contact-icon">' + item.icon + '</span><span>' + item.text + '</span></a>';
        }
        return '<div class="contact-item"><span class="contact-icon">' + item.icon + '</span><span>' + item.text + '</span></div>';
      }).join('');
    }
    function renderTimeline(container, items) {
      if (!container || !items) return;
      container.innerHTML = items.map(function(item, i) {
        var subtitleHtml = item.subtitle ? '<div class="timeline-subtitle">' + item.subtitle + '</div>' : '';
        var descHtml = item.desc ? '<p class="timeline-desc">' + item.desc + '</p>' : '';
        return '<div class="timeline-item reveal" style="--i:' + i + '"><div class="timeline-date">' + item.period + '</div><div class="timeline-title">' + item.title + '</div>' + subtitleHtml + descHtml + '</div>';
      }).join('');
    }
    var careerList = document.querySelector('.career-list');
    if (careerList) careerList.className = 'timeline';
    renderTimeline(careerList, contentData.career && contentData.career.items);
    var certList = document.querySelector('.certification-list');
    if (certList && contentData.certification && contentData.certification.items) {
      certList.innerHTML = contentData.certification.items.map(function(item) {
        return '<span class="cert-tag">' + item + '</span>';
      }).join('');
    }

  }

  renderContent();

  // ── Hero 크로마키: profile-1.mp4 초록 배경 제거 ──────────────────────────
  (function() {
    var video = document.getElementById('hero-profile-video');
    var canvas = document.getElementById('hero-canvas');
    if (!video || !canvas) return;
    var ctx = canvas.getContext('2d', { willReadFrequently: true });
    var raf = null;

    function setSize() {
      if (video.videoWidth) {
        // 표시 비율 유지: 컨테이너 너비 기준 높이 계산
        canvas.width  = video.videoWidth;
        canvas.height = video.videoHeight;
      }
    }

    function processFrame() {
      if (video.paused || video.ended) return;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      var id = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var d  = id.data;
      for (var i = 0; i < d.length; i += 4) {
        var r = d[i], g = d[i + 1], b = d[i + 2];
        // 초록 채널이 R·B보다 얼마나 더 강한지로 판단
        var greenness = g - Math.max(r, b);
        if (greenness > 25) {
          // 부드러운 엣지를 위해 선형 페이드
          d[i + 3] = Math.max(0, 255 - greenness * 5);
        }
      }
      ctx.putImageData(id, 0, 0);
      raf = requestAnimationFrame(processFrame);
    }

    video.addEventListener('loadedmetadata', setSize);
    video.addEventListener('play', function() {
      setSize();
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(processFrame);
    });
    video.addEventListener('pause', function() {
      if (raf) { cancelAnimationFrame(raf); raf = null; }
    });

    // autoplay가 이미 시작된 경우 대비
    if (!video.paused) {
      setSize();
      raf = requestAnimationFrame(processFrame);
    }
  })();

  (function() {
    var videoExts = ['mp4', 'webm', 'mov', 'avi', 'mkv'];
    function isVideoExt(ext) { return videoExts.indexOf(ext) !== -1; }

    var allItems = [];
    var lookup = {};

    function addEntry(entry, galleryOnly) {
      var key = entry[0], title = entry[1], desc = entry[2] || '', url = entry[3] || '', ext = entry[4] || 'jpg', isLarge = !!entry[5];
      var idx = allItems.length;
      allItems.push({ key: key, title: title, desc: desc, url: url, ext: ext, isLarge: isLarge, galleryOnly: galleryOnly });
      lookup[key] = idx;
    }

    if (typeof imageDataList !== 'undefined') {
      imageDataList.forEach(function(e) { addEntry(e, false); });
    }
    if (typeof imageGalleryExtra !== 'undefined') {
      imageGalleryExtra.forEach(function(e) {
        if (lookup[e[0]] !== undefined) {
          var idx = lookup[e[0]];
          allItems[idx].title = e[1] || allItems[idx].title;
          allItems[idx].desc = e[2] || allItems[idx].desc;
          allItems[idx].url = e[3] || allItems[idx].url;
        } else {
          addEntry(e, true);
        }
      });
    }

    function subfolderUrl(key, ext) {
      var dash = key.indexOf('-');
      if (dash === -1) return null;
      return 'image/' + key.slice(0, dash) + '/' + key.slice(dash + 1) + '.' + ext;
    }

    function gridUrl(item) {
      var sf = subfolderUrl(item.key, item.ext);
      if (sf) return sf;
      return 'image/' + item.key + '.' + item.ext;
    }

    function lightboxUrl(item) {
      var sf = subfolderUrl(item.key, item.ext);
      if (sf) return sf;
      if (isVideoExt(item.ext)) return 'image/' + item.key + '.' + item.ext;
      return item.isLarge
        ? 'image/' + item.key + '-lg.' + item.ext
        : 'image/' + item.key + '.' + item.ext;
    }

    function posterUrl(key) { return 'image/' + key + '-poster.webp'; }

    var lightbox = document.getElementById('lightbox');
    var lbImg = lightbox.querySelector('.lightbox-img');
    var lbVideo = lightbox.querySelector('.lightbox-video');
    var lbTitle = lightbox.querySelector('.lightbox-title');
    var lbCounter = lightbox.querySelector('.lightbox-counter');

    // Hero background — mp4 우선, webm 폴백으로 브라우저가 지원 포맷 선택
    var heroVideo = document.querySelector('.hero-bg-video');
    if (heroVideo) {
      heroVideo.innerHTML =
        '<source src="image/hero-bg.mp4" type="video/mp4">' +
        '<source src="image/hero-bg.webm" type="video/webm">';
      heroVideo.load();
    }

    // About profile — imageData의 ext가 video면 <video>로, 아니면 <img>로 렌더링
    var profileEntry = allItems[lookup['profile']];
    var aboutContainer = document.querySelector('.about-img');
    if (profileEntry && aboutContainer) {
      var profileSrc = 'image/profile.' + profileEntry.ext;
      if (isVideoExt(profileEntry.ext)) {
        aboutContainer.innerHTML = '<video src="' + profileSrc + '" muted autoplay loop playsinline style="width:100%;height:100%;object-fit:cover;display:block;"></video>';
      } else {
        var pImg = aboutContainer.querySelector('img');
        if (pImg) pImg.src = profileSrc;
      }
    }

    // Filter for display (exclude hero-bg, profile)
    var displayItems = allItems.filter(function(item) {
      return item.key !== 'hero-bg' && item.key !== 'profile';
    });

    // Build project grid
    var grid = document.getElementById('projects-grid');
    grid.innerHTML = '';
    var cardCount = 0;
    displayItems.forEach(function(item, i) {
      if (item.galleryOnly) return;
      cardCount++;
      var card = document.createElement('div');
      card.className = 'project-card reveal';
      card.style.setProperty('--i', cardCount - 1);
      card.dataset.idx = i;
      card.dataset.key = 'proj' + cardCount;
      var gUrl = gridUrl(item);
      var isVid = isVideoExt(item.ext);
      var mediaHtml = isVid
        ? '<video src="' + gUrl + '" muted autoplay playsinline loop loading="lazy" poster="' + posterUrl(item.key) + '"></video><div class="print-fallback-video"><span>&#9654;</span></div>'
        : '<img src="' + gUrl + '" alt="' + item.title + '" loading="lazy">';
      var urlVal = item.url || '';
      card.innerHTML =
        '<div class="project-img">' + mediaHtml + '</div>' +
        '<h3>' + item.title + '</h3>' +
        '<p>' + item.desc + '</p>' +
        (urlVal ? '<div class="project-link-wrap"><a href="' + urlVal + '" class="project-link" target="_blank" rel="noopener noreferrer">&#128279; Link</a></div>' : '');
      grid.appendChild(card);
    });

    var currentIdx = 0;
    var groupItems = [];

    function getBaseKey(key) {
      return key.indexOf('-') !== -1 ? key.split('-')[0] : key;
    }

    function updateLightbox(idx) {
      var item = groupItems[idx];
      if (!item) return;
      var lbUrl = lightboxUrl(item);
      var isVid = isVideoExt(item.ext);
      lbImg.style.display = isVid ? 'none' : 'block';
      lbVideo.style.display = isVid ? 'block' : 'none';
      if (isVid) { lbVideo.src = lbUrl; lbVideo.load(); lbVideo.play(); }
      else { lbImg.src = lbUrl; }
      lbCounter.textContent = (currentIdx + 1) + ' / ' + groupItems.length;
      lbTitle.textContent = item.title;
    }

    function openLightbox(idx) {
      var item = displayItems[idx];
      if (!item) return;
      var baseKey = getBaseKey(item.key);
      groupItems = [];
      displayItems.forEach(function(di) {
        if (getBaseKey(di.key) === baseKey) groupItems.push(di);
      });
      if (groupItems.length === 0) groupItems = [item];
      currentIdx = -1;
      for (var g = 0; g < groupItems.length; g++) {
        if (groupItems[g].key === item.key) { currentIdx = g; break; }
      }
      if (currentIdx === -1) currentIdx = 0;
      updateLightbox(currentIdx);
      lightbox.classList.add('active');
    }
    function closeLightbox() { lightbox.classList.remove('active'); lbVideo.pause(); lbVideo.src = ''; lbImg.src = ''; groupItems = []; }
    function moveImage(step) {
      if (groupItems.length === 0) return;
      currentIdx = (currentIdx + step + groupItems.length) % groupItems.length;
      updateLightbox(currentIdx);
    }

    function createThumb(item, idx) {
      var gUrl = gridUrl(item);
      var isVid = isVideoExt(item.ext);
      var html = isVid
        ? '<video src="' + gUrl + '" muted autoplay playsinline loop loading="lazy" poster="' + posterUrl(item.key) + '"></video><div class="print-fallback-video"><span>&#9654;</span></div>'
        : '<img src="' + gUrl + '" alt="' + item.title + '" loading="lazy">';
      var div = document.createElement('div');
      div.className = 'all-project-item';
      div.dataset.idx = idx;
      div.innerHTML = html;
      div.addEventListener('click', function() { var i = parseInt(this.dataset.idx); if (!isNaN(i)) openLightbox(i); });
      return div;
    }

    // Build Image gallery
    var allList = document.getElementById('all-projects-list');
    if (allList) {
      allList.innerHTML = '';
      var subItems = [];
      displayItems.forEach(function(item, i) {
        if (item.key.indexOf('-') !== -1) subItems.push({ item: item, idx: i });
      });
      var groups = {};
      subItems.forEach(function(entry) {
        var baseKey = entry.item.key.split('-')[0];
        if (!groups[baseKey]) groups[baseKey] = [];
        groups[baseKey].push(entry);
      });

      Object.keys(groups).forEach(function(baseKey, groupIdx) {
        var entries = groups[baseKey];
        var total = entries.length;
        var rest = entries.slice(1);

        var sizeClass = 'size-lg';

        var mainDiv = document.createElement('div');
        mainDiv.className = 'all-project-item all-project-group-header ' + sizeClass + ' reveal';
        mainDiv.style.setProperty('--i', groupIdx);
        var firstUrl = gridUrl(entries[0].item);
        var firstItem = entries[0].item;
        var groupTitle = firstItem.title || baseKey.replace(/^\d+\.\s*/, '');
        var groupSubHtml = firstItem.desc ? '<div class="all-project-group-sublabel">' + firstItem.desc + '</div>' : '';
        mainDiv.innerHTML = '<img src="' + firstUrl + '" alt="' + groupTitle + '" loading="lazy"><div class="all-project-group-label">' + groupTitle + groupSubHtml + '</div>';
        if (rest.length > 0) {
          var badge = document.createElement('span');
          badge.className = 'all-project-badge';
          badge.textContent = '+' + rest.length;
          mainDiv.appendChild(badge);

          var subsWrap = document.createElement('div');
          subsWrap.className = 'all-project-subs' + (rest.length > 20 ? ' all-project-subs-many' : '');
          rest.forEach(function(entry) { subsWrap.appendChild(createThumb(entry.item, entry.idx)); });
          var expanded = false;
          mainDiv.addEventListener('click', function(e) {
            if (e.target.tagName === 'IMG') {
              openLightbox(entries[0].idx);
              return;
            }
            expanded = !expanded;
            subsWrap.classList.toggle('open', expanded);
            badge.textContent = expanded ? '-' + rest.length : '+' + rest.length;
          });
        }
        allList.appendChild(mainDiv);
        if (subsWrap) allList.appendChild(subsWrap);
      });
    }

    // Card click -> lightbox
    document.querySelectorAll('.project-card').forEach(function(card) {
      card.addEventListener('click', function(e) {
        if (e.target.closest('.project-link-wrap')) return;
        var idx = parseInt(this.dataset.idx);
        if (!isNaN(idx)) openLightbox(idx);
      });
    });


    lightbox.addEventListener('click', function(e) { if (e.target === lightbox) closeLightbox(); });
    lightbox.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
    lightbox.querySelector('.lightbox-prev').addEventListener('click', function() { moveImage(-1); });
    lightbox.querySelector('.lightbox-next').addEventListener('click', function() { moveImage(1); });
    document.addEventListener('keydown', function(e) {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') moveImage(-1);
      if (e.key === 'ArrowRight') moveImage(1);
    });
  })();

  // --- PDF 다운로드 (페이지 실시간 캡처 → 바로 다운로드) ---
  var _pdfLibsPromise = null;
  function loadScript(src) {
    return new Promise(function(resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = function() { reject(new Error('스크립트 로드 실패: ' + src)); };
      document.head.appendChild(s);
    });
  }
  function ensurePdfLibs() {
    if (_pdfLibsPromise) return _pdfLibsPromise;
    _pdfLibsPromise = Promise.all([
      (typeof html2canvas !== 'undefined') ? Promise.resolve()
        : loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
      (window.jspdf && window.jspdf.jsPDF) ? Promise.resolve()
        : loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
    ]).catch(function(err) { _pdfLibsPromise = null; throw err; });
    return _pdfLibsPromise;
  }

  // 모든 이미지를 즉시 로드하고 완료될 때까지 대기
  function preloadAllImages() {
    var urls = [];
    document.querySelectorAll('img').forEach(function(img) {
      img.setAttribute('loading', 'eager');
      var s = img.src;
      if (s && urls.indexOf(s) === -1) urls.push(s);
    });
    if (urls.length === 0) return Promise.resolve();
    return new Promise(function(resolve) {
      var done = 0, total = urls.length;
      var tick = function() { done++; if (done >= total) resolve(); };
      urls.forEach(function(u) { var i = new Image(); i.onload = tick; i.onerror = tick; i.src = u; });
      setTimeout(resolve, 6000); // 안전 타임아웃
    });
  }

  // @media print 규칙을 실제 문서에서도 활성/복원 (정확한 높이 측정 + 고해상도 캡처용)
  function activatePrintTheme(store) {
    var sheets = document.styleSheets;
    for (var i = 0; i < sheets.length; i++) {
      var rules;
      try { rules = sheets[i].cssRules; } catch (e) { continue; }
      if (!rules) continue;
      for (var j = 0; j < rules.length; j++) {
        var rule = rules[j];
        if (rule.media && rule.media.mediaText &&
            rule.media.mediaText.indexOf('print') !== -1) {
          store.push({ rule: rule, text: rule.media.mediaText });
          rule.media.mediaText = 'all';
        }
      }
    }
  }
  function restorePrintTheme(store) {
    store.forEach(function(s) { try { s.rule.media.mediaText = s.text; } catch (e) {} });
    store.length = 0;
  }

  // 캔버스의 한 가로줄이 "거의 흰 배경"인지(=요소 사이 여백인지) 판정
  function rowIsBackground(data, width, rowOffsetPx, step) {
    var base = rowOffsetPx * width * 4;
    var bad = 0;
    var limit = Math.floor(width * 0.012); // 약 1.2%까지의 비배경 픽셀은 허용(테두리/그림자)
    for (var x = 0; x < width; x += step) {
      var i = base + x * 4;
      // 흰색에서 충분히 벗어난 픽셀 = 내용물
      if (data[i] < 244 || data[i + 1] < 244 || data[i + 2] < 244) {
        bad++;
        if (bad > limit) return false;
      }
    }
    return true;
  }

  // idealY 이하에서 내용을 가르지 않는 깔끔한 분할 지점(여백 줄)을 탐색
  function findCleanBreak(ctx, width, idealY, minY) {
    if (minY < 0) minY = 0;
    if (minY >= idealY) return idealY;
    var stripH = idealY - minY;
    var strip;
    try {
      strip = ctx.getImageData(0, minY, width, stripH);
    } catch (e) {
      return idealY; // 메모리/보안 예외 시 기존 방식으로 폴백
    }
    var data = strip.data;
    var step = Math.max(1, Math.floor(width / 600));
    // ideal에 가까운(=페이지를 꽉 채우는) 여백을 우선 선택해 위로 탐색
    for (var ry = stripH - 1; ry >= 0; ry--) {
      if (rowIsBackground(data, width, ry, step)) return minY + ry;
    }
    return idealY;
  }

  // "제목 + 패널 내용"을 하나의 통짜 블록으로 정의해 문서상 세로 범위(CSS px)를 수집한다.
  // 각 블록은 페이지 중간에서 절대 잘리지 않고 통째로 배치된다.
  // split:true 인 블록(갤러리)만 행 단위로 흐르도록 허용한다.
  function collectBlocks() {
    var defs = [
      { sel: ['.hero'], split: false },
      { sel: ['#about .section-title', '#about .about-content'], split: false },
      { sel: ['#about .about-career'], split: false },              // Experience (제목 포함)
      { sel: ['#skills .section-title', '#skills .skills-grid'], split: false },
      { sel: ['#skills .about-certification'], split: false },      // Certification (제목 포함)
      { sel: ['#skills .education'], split: false },                // Education (제목 포함)
      { sel: ['#projects'], split: false },                        // 제목 + 프로젝트 그리드
      { sel: ['#all-projects .section-title'], split: false },     // 갤러리 제목
      { sel: ['#all-projects .all-projects-list'], split: true },  // 갤러리 이미지(행 단위 분할 허용)
      { sel: ['#contact'], split: false },                         // 제목 + 연락처
      { sel: ['footer'], split: false }
    ];
    var blocks = [];
    defs.forEach(function(d) {
      var top = Infinity, bottom = -Infinity;
      d.sel.forEach(function(s) {
        document.querySelectorAll(s).forEach(function(el) {
          var r = el.getBoundingClientRect();
          if (r.height <= 0) return;
          var t = r.top + window.scrollY, b = r.bottom + window.scrollY;
          if (t < top) top = t;
          if (b > bottom) bottom = b;
        });
      });
      if (bottom > top) blocks.push({ top: top, bottom: bottom, split: d.split });
    });
    return blocks;
  }

  // .project-img / .all-project-item 안의 video를 img로 대체한다.
  // 이미 재생 중인 영상은 현재 프레임을 즉시 그리고,
  // 아직 미로드 영상은 첫 프레임만 받아 그린다(seek 없음 → 빠름).
  function captureVideoFrames() {
    var containers = document.querySelectorAll('.project-img, .all-project-item');
    var promises = [];
    Array.prototype.forEach.call(containers, function(container) {
      var video = container.querySelector('video');
      var fallback = container.querySelector('.print-fallback-video');
      if (!video) return;
      var p = new Promise(function(resolve) {
        var done = false;
        var timer = setTimeout(resolve, 5000);
        var injectFrame = function() {
          if (done) return; done = true;
          clearTimeout(timer);
          try {
            var vw = video.videoWidth, vh = video.videoHeight;
            if (vw && vh) {
              var c = document.createElement('canvas');
              c.width = vw; c.height = vh;
              c.getContext('2d').drawImage(video, 0, 0);
              var img = document.createElement('img');
              img.className = 'pdf-video-frame';
              img.src = c.toDataURL('image/jpeg', 0.92);
              img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
              if (fallback) fallback.style.setProperty('display', 'none', 'important');
              container.appendChild(img);
            }
          } catch(e) {}
          resolve();
        };
        if (video.readyState >= 2) {
          // 이미 재생 중 → 현재 프레임 즉시 캡처
          injectFrame();
        } else {
          // 미로드(뷰포트 밖 lazy 등) → 첫 프레임만 로드 후 캡처
          video.removeAttribute('loading');
          video.preload = 'auto';
          video.addEventListener('loadeddata', injectFrame, { once: true });
          video.load();
        }
      });
      promises.push(p);
    });
    return Promise.all(promises);
  }

  function downloadPDF() {
    var btn = document.querySelector('.btn-pdf');
    var label = btn ? btn.textContent : '';
    var printStore = [];
    var pageMeta = { blocks: [], printHeight: 0 };
    var setBusy = function(on) {
      if (!btn) return;
      btn.textContent = on ? 'PDF 생성 중…' : label;
      btn.style.pointerEvents = on ? 'none' : '';
      btn.style.opacity = on ? '0.7' : '';
    };
    setBusy(true);

    ensurePdfLibs()
      .then(preloadAllImages)
      .then(captureVideoFrames)   // pdf-exporting 전에 캡처 — video가 살아있는 상태여야 seek 가능
      .then(function() {
        activatePrintTheme(printStore);
        document.body.classList.add('pdf-exporting');
        return new Promise(function(r) { setTimeout(r, 350); });
      })
      .then(function() {
        var widthPx = document.documentElement.scrollWidth;
        var printHeight = document.body.scrollHeight; // 인쇄 테마 기준 실제 높이
        // 캡처와 동일한 레이아웃(인쇄 테마)에서 블록 범위를 측정해 둔다.
        pageMeta.printHeight = printHeight;
        pageMeta.blocks = collectBlocks();
        // 브라우저 캔버스 한계(최대 변·최대 면적) 안에서 스케일을 최대한 크게 → 선명하게
        var MAX_DIM = 32760;       // 안전한 최대 변 길이(px)
        var MAX_AREA = 2.4e8;      // 안전한 최대 면적(px²)
        var scale = Math.min(
          3,                                   // 목표 해상도(3배)
          MAX_DIM / printHeight,
          MAX_DIM / widthPx,
          Math.sqrt(MAX_AREA / (printHeight * widthPx))
        );
        if (scale < 1) scale = 1;              // 너무 길면 최소 1배는 유지
        return html2canvas(document.body, {
          scale: scale,
          useCORS: true,
          allowTaint: true,
          backgroundColor: '#ffffff', // 인쇄용 흰 배경
          windowWidth: widthPx,
          scrollX: 0,
          scrollY: 0,
          ignoreElements: function(el) {
            return el.classList && (
              el.classList.contains('navbar') ||
              el.classList.contains('lightbox') ||
              el.classList.contains('btn-pdf')
            );
          },
          onclone: function(clonedDoc) {
            // 복제 문서에서도 인쇄 테마/흰 배경 보장
            clonedDoc.documentElement.style.background = '#ffffff';
            clonedDoc.body.style.background = '#ffffff';
            clonedDoc.body.classList.add('pdf-exporting');
          }
        });
      })
      .then(function(canvas) {
        restorePrintTheme(printStore);
        document.body.classList.remove('pdf-exporting');
        // 캡처용으로 주입했던 video 프레임 img 제거 + fallback 복원
        Array.prototype.forEach.call(document.querySelectorAll('.pdf-video-frame'), function(el) {
          el.parentNode.removeChild(el);
        });
        Array.prototype.forEach.call(document.querySelectorAll('.print-fallback-video'), function(el) {
          el.style.removeProperty('display');
        });
        var jsPDF = window.jspdf.jsPDF;
        // A4 너비(210mm) 기준으로 캔버스 비율에 맞춘 높이 → 한 장짜리 PDF
        var pageW = 210;
        var pageH = (canvas.height / canvas.width) * pageW;
        var pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: [pageW, pageH] });
        pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, pageW, pageH);

        var name = (typeof contentData !== 'undefined' && contentData.hero && contentData.hero.name)
          ? contentData.hero.name : 'Portfolio';
          pdf.save('유태일_3DArtist_Portfolio.pdf');
        setBusy(false);
      })
      .catch(function(err) {
        restorePrintTheme(printStore);
        document.body.classList.remove('pdf-exporting');
        setBusy(false);
        console.error('PDF 생성 실패, 인쇄 대화상자로 대체합니다:', err);
        window.print(); // 라이브러리 로드 실패 등 예외 시 폴백
      });
  }

  // ── 총경력 계산
  (function() {
    var el = document.querySelector('.career-years');
    if (!el || !contentData.career || !contentData.career.items) return;
    var years = contentData.career.items.map(function(it) { return parseInt(it.period); }).filter(Boolean);
    if (!years.length) return;
    el.textContent = '총 ' + (new Date().getFullYear() - Math.min.apply(null, years)) + '년+';
  })();

  // ── A. 진입 애니메이션 (Intersection Observer)
  (function() {
    if (!window.IntersectionObserver) {
      document.querySelectorAll('.reveal').forEach(function(el) { el.classList.add('visible'); });
      return;
    }
    var obs = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) { entry.target.classList.add('visible'); obs.unobserve(entry.target); }
      });
    }, { threshold: 0.08 });
    var vh = window.innerHeight;
    document.querySelectorAll('.reveal').forEach(function(el) {
      var top = el.getBoundingClientRect().top;
      if (top < vh) {
        el.classList.add('visible');  // 이미 뷰포트 안 — 즉시 표시
      } else {
        obs.observe(el);              // 아래쪽 — 스크롤 시 트리거
      }
    });
  })();

  // ── 햄버거 메뉴 토글
  (function() {
    var navbar = document.querySelector('.navbar');
    var toggle = document.querySelector('.nav-toggle');
    if (!toggle || !navbar) return;
    toggle.addEventListener('click', function() {
      var open = navbar.classList.toggle('nav-open');
      toggle.setAttribute('aria-expanded', String(open));
    });
    navbar.addEventListener('click', function(e) {
      if (e.target.closest('.nav-links a')) {
        navbar.classList.remove('nav-open');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });
  })();

  // ── B. 활성 nav 하이라이트
  (function() {
    var sections = Array.from(document.querySelectorAll('section[id]'));
    var links = Array.from(document.querySelectorAll('.nav-links a'));
    function update() {
      var y = window.scrollY + 100;
      var cur = sections.length ? sections[0].id : '';
      sections.forEach(function(s) { if (s.offsetTop <= y) cur = s.id; });
      links.forEach(function(a) { a.classList.toggle('active', a.getAttribute('href') === '#' + cur); });
    }
    window.addEventListener('scroll', update, { passive: true });
    update();
  })();

</script>
</body>
